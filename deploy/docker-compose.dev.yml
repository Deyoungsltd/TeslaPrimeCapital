version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: teslaprime_dev_pg
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: teslaprime_dev
    ports:
      - "5432:5432"
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - teslaprime_dev_net

  redis:
    image: redis:7-alpine
    container_name: teslaprime_dev_redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data
    networks:
      - teslaprime_dev_net

  mailhog:
    image: mailhog/mailhog:latest
    container_name: teslaprime_dev_mailhog
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - teslaprime_dev_net

volumes:
  dev_pg_data:
  dev_redis_data:

networks:
  teslaprime_dev_net:
    driver: bridge
